name: Canonical MCP URL

# Public URL: https://agents.go-foresee.com/mcp — everywhere in this repo.
# Never the generated *.run.app hostnames.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No Cloud Run hostname in tracked files
        run: |
          if git grep -n -I -E -e '[a-z0-9-]+\.(a\.)?run\.app' -- . ':!.github/workflows/canonical-url.yml'; then
            echo "::error::Cloud Run hostname found; use https://agents.go-foresee.com/mcp"
            exit 1
          fi

      - name: One MCP host repo-wide
        run: |
          if git grep -n -I -e 'mcp\.go-foresee\.com' -- . ':!.github/workflows/canonical-url.yml'; then
            echo "::error::this repo points at https://agents.go-foresee.com/mcp"
            exit 1
          fi

      - name: Install buttons point at the canonical host
        run: |
          python3 - <<'EOF'
          import base64, json, re, sys
          from urllib.parse import unquote, urlsplit
          CANONICAL_HOSTS = {"agents.go-foresee.com"}
          text = open("README.md", encoding="utf-8").read()
          urls = []
          for payload in re.findall(r"install-mcp\?[^)]*?config=([A-Za-z0-9_=+/-]+)", text):
              padded = payload + "=" * (-len(payload) % 4)
              urls.append(json.loads(base64.urlsafe_b64decode(padded))["url"])
          for payload in re.findall(r"hermes://mcp/install\?[^)\"]*?config=([A-Za-z0-9_=+/-]+)", text):
              padded = payload + "=" * (-len(payload) % 4)
              urls.append(json.loads(base64.urlsafe_b64decode(padded))["url"])
          urls += [unquote(u) for u in re.findall(r"connectorUrl=([^)&]+)", text)]
          bad = [u for u in urls if urlsplit(u).netloc not in CANONICAL_HOSTS]
          if not urls:
              sys.exit("no install buttons found in README.md — check the regexes")
          if bad:
              sys.exit(f"install buttons point off-canonical: {bad}")
          print(f"OK: {len(urls)} install-button URL(s)")
          EOF
